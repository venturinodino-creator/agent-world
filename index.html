<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent World</title>
<link rel="stylesheet" href="style.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<header>
  <div class="brand">AGENT_WORLD</div>
  <div class="grow"></div>
  <span class="meta" id="meta"></span>
  <button class="btn" id="btnDormant">dormant: hidden</button>
  <button class="btn" id="btnFit">fit</button>
  <span class="meta" id="sync">loading…</span>
</header>
<div class="banner" id="banner" hidden></div>
<div class="layout">
  <main class="stage" id="stage">
    <div class="labels" id="labels" aria-hidden="true"></div>
    <aside class="card" id="card" hidden></aside>
    <section class="feed" id="feed" aria-label="Activity feed">
      <div class="ph"><span>Activity · last 24h replay</span></div>
      <p class="empty" hidden>Quiet day: no commits or runs in the last 24 hours.</p>
      <ul class="feed-list"></ul>
    </section>
  </main>
  <aside class="side" id="side" aria-label="Repos and agents"></aside>
</div>
<script type="module" src="src/main.mjs"></script>
</body>
</html>
